name: CI / Build Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dinesmart/frontend-web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dinesmart/frontend-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Production Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_GROQ_MODEL: ${{ secrets.VITE_GROQ_MODEL }}
